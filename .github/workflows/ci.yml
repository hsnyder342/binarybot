name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/setup@v1
      with:
        version: 11
        runtime: node@20
        cache: true
    - name: Install pnpm
      run: npm install -g pnpm
    - name: Install dependencies
      run: pnpm install
    - name: Type check
      run: pnpm typecheck
    - name: Lint
      run: pnpm lint
    - name: Test
      run: pnpm test