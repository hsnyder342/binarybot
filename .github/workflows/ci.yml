name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/setup@v1
      with:
        version: 12
        runtime: node@24
    - name: Type check
      run: pnpm typecheck
    - name: Lint
      run: pnpm lint
    - name: Test
      run: pnpm test